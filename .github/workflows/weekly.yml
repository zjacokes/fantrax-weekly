name: Weekly snapshot

on:
  schedule:
    # GitHub cron is UTC. 14:17 UTC = 9:17am EST (10:17am EDT after Mar 14).
    # Off-the-hour minute because :00 schedules are often delayed.
    - cron: "17 14 * * 1"
  workflow_dispatch:   # adds a "Run workflow" button for manual runs

permissions:
  contents: write      # lets the job commit the new snapshot and page

concurrency:
  group: weekly-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04   # pinned; avoids surprise image migrations mid-season
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Take snapshot
        run: python src/run_snapshot.py

      - name: Build page
        run: python src/build_page.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots docs
          git diff --cached --quiet && exit 0
          git commit -m "Weekly snapshot $(date -u +%Y-%m-%d)"
          # If main moved while this job ran (e.g. you pushed code), replay the
          # bot's commit on top. On a conflict in generated files, keep the bot's copy.
          git pull --rebase -X theirs origin main
          git push

