name: Weekly snapshot

on:
  schedule:
    # GitHub cron is UTC. 14:17 UTC = 9:17am EST (10:17am EDT after Mar 14).
    # Off-the-hour minute because :00 schedules are often delayed.
    - cron: "17 14 * * 1"
  workflow_dispatch:   # adds a "Run workflow" button for manual runs

permissions:
  contents: write      # lets the job commit the new snapshot and page

concurrency:
  group: weekly-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Take snapshot
        run: python src/run_snapshot.py

      - name: Build page
        run: python src/build_page.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots docs
          git diff --cached --quiet || git commit -m "Weekly snapshot $(date -u +%Y-%m-%d)"
          git push
